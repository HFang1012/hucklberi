      <path d="M27 8 L10 25 L27 42"/>
      <path d="M40 52 L53 52"/>
    </g>
    <g stroke="#FFDB4D" stroke-width="8.5">
      <path d="M27 8 L10 25 L27 42"/>
      <path d="M40 52 L53 52"/>
    </g>
  </g>
